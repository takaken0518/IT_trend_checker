name: ITTrendApp
options:
  bundleIdPrefix: com.takaken0518
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  ITTrendApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: ITTrendApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takaken0518.ittrend
        INFOPLIST_FILE: ITTrendApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: ITTrendApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: ITTrendWidgetExtension
        embed: true
  ITTrendWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: ITTrendWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takaken0518.ittrend.widget
        INFOPLIST_FILE: ITTrendWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: ITTrendWidgetExtension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
schemes:
  ITTrendApp:
    build:
      targets:
        ITTrendApp: all
        ITTrendWidgetExtension: all
